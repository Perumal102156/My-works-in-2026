<!DOCTYPE html>
<html>

<head>

    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="p-3">

<div class="container-fluid">

    <div class="d-flex justify-content-between mb-3">

        <h3>Call Reports</h3>

        <a href="/dashboard" class="btn btn-primary">
            Back Dashboard
        </a>

    </div>
    <form method="GET" action="/reports" class="row g-2 mb-3">

    <div class="col-md-3">
        <input type="date"
               name="start_date"
               class="form-control">
    </div>

    <div class="col-md-3">
        <input type="date"
               name="end_date"
               class="form-control">
    </div>

    <div class="col-md-3">

        <select name="campaign" class="form-control">

            <option value="">
                Select Campaign
            </option>

            {% for c in campaigns %}

            <option value="{{ c[0] }}">
                {{ c[0] }}
            </option>

            {% endfor %}

        </select>

    </div>

    <div class="col-md-3 d-flex gap-2">

        <button type="submit" class="btn btn-primary w-100">
            Filter
        </button>

        <a href="/export-report?start_date={{ request.args.get('start_date', '') }}&end_date={{ request.args.get('end_date', '') }}&campaign={{ request.args.get('campaign', '') }}"
           class="btn btn-success w-100">

            Export Excel

        </a>

    </div>

</form>

    <table class="table table-bordered table-striped">

        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Phone</th>
            <th>Campaign</th>
            <th>Status</th>
            <th>Disposition</th>
            <th>Notes</th>
            <th>Callback</th>
        </tr>

        {% for call in calls %}
        <tr>
            <td>{{ call[0] }}</td>
            <td>{{ call[1] }}</td>
            <td>{{ call[2] }}</td>
            <td>{{ call[3] }}</td>
            <td>{{ call[4] }}</td>
            <td>{{ call[5] }}</td>
            <td>{{ call[6] }}</td>
            <td>{{ call[7] }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>

</html>
