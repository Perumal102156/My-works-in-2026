<!DOCTYPE html>
<html>

<head>

    <title>Edit Agent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="p-4">

<div class="container">

    <div class="card p-4">

        <h3>Edit Agent</h3>

        <form method="POST">

            <input type="text"
                   name="name"
                   class="form-control mb-3"
                   value="{{ agent[1] }}">

            <input type="text"
                   name="extension"
                   class="form-control mb-3"
                   value="{{ agent[2] }}">

            <input type="text"
                   name="password"
                   class="form-control mb-3"
                   value="{{ agent[3] }}">

            <select name="status"
                    class="form-control mb-3">

                <option {% if agent[4]=='Active' %}selected{% endif %}>
                    Active
                </option>

                <option {% if agent[4]=='Inactive' %}selected{% endif %}>
                    Inactive
                </option>

            </select>

            <button class="btn btn-success">
                Update Agent
            </button>

        </form>

    </div>

</div>

</body>

</html>
